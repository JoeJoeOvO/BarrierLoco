name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install quality tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black==24.3.0 isort==5.13.2 flake8==7.0.0

      - name: Check Python formatting
        run: |
          set -euo pipefail
          python -m black --check .
          python -m isort --check-only --profile black .

      - name: Lint Python
        run: |
          set -euo pipefail
          # Project-wide flake8 configuration lives in .flake8.
          python -m flake8 .

  unit-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install mypy numpy pytest pytest-cov PyYAML
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install LocoLab
        run: |
          set -euo pipefail
          python -m pip install -e ./locolab

      - name: Run fast tests and syntax checks
        run: |
          set -euo pipefail
          python -m compileall -q locolab tests .github/scripts
          python -m pytest --cov=locolab --cov-report=xml

      - name: Type-check packaging tools
        run: |
          set -euo pipefail
          python -m mypy --follow-imports=skip locolab/setup.py .github/scripts/check_locolab_dist.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build and validate wheel and sdist
        run: |
          set -euo pipefail
          shopt -s nullglob
          python -m build --sdist --wheel --outdir dist locolab
          python -m twine check dist/*

          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python .github/scripts/check_locolab_dist.py --wheel "${wheels[0]}" --sdist "${sdists[0]}"

      - name: Smoke-test installed runtime resources
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "${RUNNER_TEMP}/locolab-package-smoke"
          "${RUNNER_TEMP}/locolab-package-smoke/bin/python" -m pip install --no-deps "${wheels[0]}"
          "${RUNNER_TEMP}/locolab-package-smoke/bin/python" -I .github/scripts/check_locolab_dist.py --installed
