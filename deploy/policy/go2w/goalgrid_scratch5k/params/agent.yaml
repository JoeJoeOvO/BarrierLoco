class_name: OnPolicyRunner
seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 5000
empirical_normalization: false
obs_groups:
  policy:
  - policy
  critic:
  - critic
clip_actions: null
save_interval: 500
experiment_name: omnibot_go2w_parkour_goal_grid_mlp_v0
run_name: goalgrid_scratch_env4096_5k
logger: tensorboard
neptune_project: isaaclab
wandb_project: omnibot-go2w
wandb_entity: null
wandb_group: null
resume: false
resume_experiment_name: omnibot_go2w_parkour_goal_grid_mlp_v0
load_run: .*
load_checkpoint: model_.*.pt
policy:
  class_name: ActorCritic
  init_noise_std: 0.6
  noise_std_type: scalar
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
