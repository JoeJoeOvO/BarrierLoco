repos:
  - repo: https://github.com/python/black
    rev: 24.3.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-simplify, flake8-return]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # Preserve archived patches and exact experiment configuration bytes.
        exclude: ^(artifacts/experiment_snapshots/|(?:docs/experiments/|deploy/policy/).*\.(yaml|json)$)
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
        args: ["--maxkb=2000"] # restrict files more than 2 MB. Should use git-lfs instead.
      - id: check-yaml
        # Isaac Lab emits Python-tagged YAML; validate syntax without loading objects.
        args: ["--unsafe"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
        exclude: ^deploy/src/rl_deploy/library/thirdparty/
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(artifacts/experiment_snapshots/|(?:docs/experiments/|deploy/policy/).*\.(yaml|json)$)
      - id: check-shebang-scripts-are-executable
        exclude: ^deploy/src/rl_deploy/library/thirdparty/
      - id: detect-private-key
        exclude: ^deploy/src/rl_deploy/library/thirdparty/
      - id: debug-statements
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.1
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        exclude: ^deploy/src/rl_deploy/library/(thirdparty|core/matplotlibcpp)/
        additional_dependencies:
          - tomli
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
